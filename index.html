<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#12385b">
  <title>Expediente de Orientación Educativa · EPOANT</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4f9}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
      font:600 15px Arial,sans-serif;color:#173b5e;background:#eef4f9;z-index:2}
    #loadingBox{background:#fff;border:1px solid #d9e5ee;border-radius:16px;padding:18px 22px;
      box-shadow:0 12px 36px rgba(23,59,94,.12);text-align:center}
    .spinner{width:28px;height:28px;border:3px solid #d9e8f1;border-top-color:#173b5e;
      border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div id="loading">
    <div id="loadingBox">
      <div class="spinner"></div>
      Cargando Expediente de Orientación Educativa…
    </div>
  </div>

  <iframe
    id="app"
    title="Expediente de Orientación Educativa EPOANT"
    src="https://script.google.com/macros/s/AKfycbyWDG7dnYQ6VgNLXG4UCInoFr0b9WxZtLVUVJE3tnQdp8A0I222vV4j1TgEPPvTlag/exec?embed=1&v=2.3.1-cumplimiento-grupos"
    allow="camera; clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>

  <script>
    const frame=document.getElementById('app');
    frame.addEventListener('load',()=>{
      document.getElementById('loading').style.display='none';
    });
    setTimeout(()=>{
      document.getElementById('loading').style.display='none';
    },12000);
  </script>
</body>
</html>
